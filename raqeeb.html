<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Raqeeb — Venue Security & AI Demo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      :root {
        color-scheme: light;
        --background: #f8fafc;
        --foreground: #0f172a;
        --card: #ffffff;
        --card-foreground: #0f172a;
        --c2: #f1f5f9;
        --muted: #f1f5f9;
        --muted-foreground: #64748b;
        --border: #e2e8f0;
        --primary: #0f766e;
        --primary-foreground: #ffffff;
        --destructive: #dc2626;
        --accent: #f1f5f9;
        --ring: #0f766e;

        /* Core compatibility tokens */
        --bg: #f8fafc;
        --bd: #e2e8f0;
        --tx: #0f172a;
        --mu: #64748b;
        --cy: #0f766e;
        --cy-light: #f0fdfa;
        --cy-border: #99f6e4;
        --cy-hover: #115e59;
        --gr: #16a34a;
        --am: #d97706;
        --or: #ea580c;
        --rd: #dc2626;
        --bl: #2563eb;

        --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
        --shadow: 0 1px 3px 0 rgb(0 0 0 / 0.1), 0 1px 2px -1px rgb(0 0 0 / 0.1);
        --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.08), 0 2px 4px -2px rgb(0 0 0 / 0.08);
        --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.08), 0 4px 6px -4px rgb(0 0 0 / 0.08);
        --header-bg: rgba(255, 255, 255, 0.88);
        --sidebar-bg: #ffffff;
        --overlay-bg: rgba(15, 23, 42, 0.45);
        --table-hover: #f8fafc;
        --video-bg: #0b1120;

        box-sizing: border-box;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }

      [data-theme="dark"] {
        color-scheme: dark;
        --background: #0b1120;
        --foreground: #e2e8f0;
        --card: #131c2e;
        --card-foreground: #e2e8f0;
        --c2: #1e293b;
        --muted: #1e293b;
        --muted-foreground: #94a3b8;
        --border: #1e293b;
        --primary: #2dd4bf;
        --primary-foreground: #042f2e;
        --destructive: #f87171;
        --accent: #1e293b;
        --ring: #2dd4bf;

        /* Core compatibility tokens */
        --bg: #0b1120;
        --bd: #1e293b;
        --tx: #e2e8f0;
        --mu: #94a3b8;
        --cy: #2dd4bf;
        --cy-light: #132c2a;
        --cy-border: #134e48;
        --cy-hover: #5eead4;
        --gr: #4ade80;
        --am: #fbbf24;
        --or: #fb923c;
        --rd: #f87171;
        --bl: #60a5fa;

        --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.3);
        --shadow: 0 1px 3px 0 rgb(0 0 0 / 0.3), 0 1px 2px -1px rgb(0 0 0 / 0.3);
        --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.3), 0 2px 4px -2px rgb(0 0 0 / 0.3);
        --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.4), 0 4px 6px -4px rgb(0 0 0 / 0.4);
        --header-bg: rgba(11, 17, 32, 0.88);
        --sidebar-bg: #0e1626;
        --overlay-bg: rgba(2, 6, 23, 0.75);
        --table-hover: #1e293b55;
        --video-bg: #0b1220;
      }

      html {
        scroll-padding-top: env(safe-area-inset-top, 0px);
      }
      body {
        background-color: var(--bg);
        color: var(--tx);
        font: 14px/1.5 "Inter", system-ui, -apple-system, sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        transition: background-color 0.2s ease, color 0.2s ease;
      }
      [lang="ar"], [dir="rtl"] {
        font-family: "IBM Plex Sans Arabic", "Inter", system-ui, sans-serif;
      }

      .app {
        display: flex;
        min-height: 100vh;
      }
      nav {
        width: 240px;
        flex: none;
        position: sticky;
        top: env(safe-area-inset-top, 0px);
        height: 100dvh;
        background: var(--sidebar-bg);
        border-right: 1px solid var(--bd);
        display: flex;
        flex-direction: column;
        padding: 16px 12px;
        transition: width 0.2s ease, background-color 0.2s ease, border-color 0.2s ease;
      }
      .logo {
        font-weight: 700;
        font-size: 22px;
        padding: 4px 10px 16px;
        display: flex;
        gap: 10px;
        align-items: center;
        letter-spacing: -0.02em;
        color: var(--tx);
      }
      .logo span {
        color: var(--tx);
      }
      .logo i {
        width: 26px;
        height: 26px;
        border-radius: 8px;
        background: var(--cy);
      }
      .logo-eye {
        width: 28px;
        height: 28px;
        flex: none;
        color: var(--cy);
        filter: drop-shadow(0 0 8px color-mix(in srgb, var(--cy) 40%, transparent));
      }
      nav a {
        display: flex;
        gap: 10px;
        align-items: center;
        padding: 9px 12px;
        border-radius: 8px;
        color: var(--mu);
        font-size: 13px;
        font-weight: 500;
        cursor: pointer;
        text-decoration: none;
        transition: all 0.15s ease;
      }
      nav a:hover {
        background: var(--c2);
        color: var(--tx);
      }
      nav a.on {
        background: var(--cy-light);
        color: var(--cy);
        font-weight: 600;
        box-shadow: inset 3px 0 var(--cy);
      }
      .sys {
        margin-top: auto;
        padding: 12px;
        border: 1px solid var(--bd);
        border-radius: 10px;
        font-size: 12px;
        color: var(--mu);
        display: grid;
        gap: 5px;
        background: var(--c2);
      }
      .dot {
        display: inline-block;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--gr);
        box-shadow: 0 0 8px var(--gr);
        margin-right: 6px;
        animation: pu 2s infinite;
      }
      .mn {
        flex: 1;
        min-width: 0;
        position: relative;
      }
      .top {
        position: sticky;
        top: env(safe-area-inset-top, 0px);
        z-index: 20;
        display: flex;
        gap: 10px;
        align-items: center;
        padding: 12px 24px;
        background: var(--header-bg);
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
        border-bottom: 1px solid var(--bd);
        transition: background-color 0.2s ease, border-color 0.2s ease;
      }
      .top input {
        flex: 1;
        max-width: 440px;
        background: var(--card);
        border: 1px solid var(--bd);
        color: var(--tx);
        padding: 8px 14px;
        border-radius: 8px;
        outline: 0;
        font: inherit;
        font-size: 13px;
        transition: border-color 0.15s ease, box-shadow 0.15s ease;
      }
      .top input:focus {
        border-color: var(--cy);
        box-shadow: 0 0 0 3px color-mix(in srgb, var(--cy) 15%, transparent);
      }
      .chip {
        padding: 6px 12px;
        border-radius: 8px;
        border: 1px solid var(--bd);
        font-size: 12px;
        font-weight: 500;
        cursor: pointer;
        background: var(--card);
        color: var(--mu);
        white-space: nowrap;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        transition: all 0.15s ease;
      }
      .chip:hover {
        background: var(--c2);
        color: var(--tx);
        border-color: var(--bd);
      }
      .chip.on {
        color: var(--cy);
        border-color: var(--cy);
        background: var(--cy-light);
      }
      .mode-chip {
        color: var(--gr);
        border-color: color-mix(in srgb, var(--gr) 30%, transparent);
        background: color-mix(in srgb, var(--gr) 8%, var(--card));
      }

      main {
        padding: 24px clamp(16px, 3vw, 36px);
        display: grid;
        gap: 18px;
      }
      main > * {
        min-width: 0;
      }
      h1, h2, h3 {
        color: var(--tx);
        font-weight: 600;
        letter-spacing: -0.02em;
      }
      h1 {
        font-size: 22px;
        line-height: 1.25;
      }
      h2 {
        font-size: 15px;
        line-height: 1.35;
        margin-bottom: 8px;
      }
      .card {
        background: var(--card);
        border: 1px solid var(--bd);
        border-radius: 12px;
        padding: 18px;
        box-shadow: var(--shadow-sm);
        transition: border-color 0.15s ease;
      }
      .mu {
        color: var(--mu);
      }
      .big {
        font-size: 26px;
        font-weight: 700;
        display: block;
        letter-spacing: -0.03em;
        font-variant-numeric: tabular-nums;
      }
      .g {
        display: grid;
        gap: 14px;
      }
      .st {
        grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
      }
      .two {
        grid-template-columns: minmax(0, 2fr) minmax(280px, 1fr);
      }
      @media (max-width: 1100px) {
        .two {
          grid-template-columns: 1fr;
        }
      }
      @media (max-width: 820px) {
        nav {
          width: 64px;
        }
        nav a span,
        .logo span,
        .sys {
          display: none;
        }
        main {
          padding: 14px;
        }
        .top {
          padding: 10px 14px;
        }
      }
      .b {
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.02em;
        padding: 2px 8px;
        border-radius: 6px;
        color: var(--c);
        background: color-mix(in srgb, var(--c) 12%, transparent);
        border: 1px solid color-mix(in srgb, var(--c) 25%, transparent);
        white-space: nowrap;
        display: inline-flex;
        align-items: center;
      }
      .al {
        display: grid;
        grid-template-columns: 4px 1fr auto;
        gap: 14px;
        align-items: center;
        padding: 12px 16px;
        border: 1px solid var(--bd);
        border-radius: 10px;
        background: var(--card);
        cursor: pointer;
        transition: all 0.15s ease;
        box-shadow: var(--shadow-sm);
      }
      .al:hover {
        transform: translateY(-1px);
        border-color: var(--c);
        box-shadow: var(--shadow);
      }
      .al .ab {
        align-self: stretch;
        border-radius: 4px;
        background: var(--c);
      }
      .al.cr {
        border-color: var(--rd);
        box-shadow: 0 0 0 1px color-mix(in srgb, var(--rd) 40%, transparent);
      }
      .am {
        display: flex;
        gap: 10px;
        align-items: center;
        flex-wrap: wrap;
      }
      .tw {
        overflow-x: auto;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 13px;
      }
      th {
        font-size: 11px;
        color: var(--mu);
        text-align: left;
        padding: 10px 12px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        border-bottom: 1px solid var(--bd);
        background: var(--c2);
      }
      td {
        padding: 11px 12px;
        border-top: 1px solid var(--bd);
        white-space: nowrap;
        color: var(--tx);
      }
      tr.r {
        cursor: pointer;
      }
      tr.r:hover td {
        background: var(--table-hover);
      }
      select {
        background: var(--card);
        color: var(--tx);
        border: 1px solid var(--bd);
        border-radius: 8px;
        padding: 6px 10px;
        font: inherit;
        font-size: 13px;
        outline: 0;
      }
      select:focus {
        border-color: var(--cy);
      }
      .fl {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        align-items: center;
      }
      .ov {
        position: fixed;
        inset: 0;
        background: var(--overlay-bg);
        backdrop-filter: blur(6px);
        -webkit-backdrop-filter: blur(6px);
        display: none;
        z-index: 50;
        padding: 20px;
        overflow: auto;
      }
      .ov.on {
        display: block;
      }
      .md {
        max-width: 860px;
        margin: 40px auto;
        background: var(--card);
        border: 1px solid var(--bd);
        border-radius: 14px;
        padding: 24px;
        display: grid;
        gap: 18px;
        box-shadow: var(--shadow-lg);
        animation: in 0.2s ease-out;
        color: var(--tx);
      }
      .md.dr {
        max-width: 440px;
        margin-right: 0;
      }
      @keyframes in {
        from {
          opacity: 0;
          transform: translateY(8px);
        }
      }
      @keyframes pu {
        50% {
          opacity: 0.4;
        }
      }
      .kv {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
        gap: 10px;
      }
      .kv div {
        background: var(--c2);
        border: 1px solid var(--bd);
        border-radius: 8px;
        padding: 8px 12px;
      }
      .kv small {
        display: block;
        color: var(--mu);
        font-size: 11px;
        margin-bottom: 2px;
      }
      .wf {
        display: flex;
        gap: 6px;
        overflow-x: auto;
      }
      .wf div {
        flex: 1;
        min-width: 104px;
        text-align: center;
        font-size: 11px;
        padding: 8px 6px;
        border-radius: 8px;
        border: 1px solid var(--bd);
        color: var(--mu);
        background: var(--card);
      }
      .wf .d {
        color: var(--gr);
        border-color: color-mix(in srgb, var(--gr) 35%, transparent);
        background: color-mix(in srgb, var(--gr) 8%, var(--card));
      }
      .wf .a {
        color: var(--cy);
        border-color: var(--cy);
        background: var(--cy-light);
        font-weight: 600;
      }
      .tl {
        border-left: 2px solid var(--bd);
        padding-left: 16px;
        display: grid;
        gap: 12px;
        margin-left: 6px;
      }
      .tl div {
        position: relative;
      }
      .tl div:before {
        content: "";
        position: absolute;
        left: -22px;
        top: 5px;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--cy);
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        background: var(--cy);
        color: var(--primary-foreground);
        border: 1px solid transparent;
        padding: 8px 14px;
        border-radius: 8px;
        font-weight: 500;
        font-size: 13px;
        cursor: pointer;
        transition: all 0.15s ease;
        box-shadow: var(--shadow-sm);
        text-decoration: none;
      }
      .btn:hover {
        opacity: 0.92;
        transform: translateY(-1px);
        box-shadow: var(--shadow);
      }
      .btn.o {
        background: var(--card);
        color: var(--tx);
        border: 1px solid var(--bd);
      }
      .btn.o:hover {
        background: var(--c2);
        color: var(--tx);
        border-color: var(--bd);
      }
      button {
        font: inherit;
      }
      .x {
        float: right;
        cursor: pointer;
        color: var(--mu);
        font-size: 22px;
        background: none;
        border: 0;
        line-height: 1;
      }
      .x:hover {
        color: var(--tx);
      }
      #ts {
        position: fixed;
        bottom: 24px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 80;
        display: grid;
        gap: 8px;
        pointer-events: none;
      }
      #ts div {
        background: var(--card);
        color: var(--tx);
        border: 1px solid var(--bd);
        padding: 10px 18px;
        border-radius: 8px;
        font-size: 13px;
        font-weight: 500;
        box-shadow: var(--shadow-md);
        animation: in 0.2s ease;
        pointer-events: auto;
      }
      #np {
        position: absolute;
        right: 24px;
        top: 58px;
        width: 340px;
        max-width: calc(100vw - 28px);
        display: none;
        z-index: 30;
        gap: 8px;
        box-shadow: var(--shadow-lg);
        background: var(--card);
      }
      #np.on {
        display: grid;
      }
      .nt {
        padding: 10px 12px;
        border-radius: 8px;
        background: var(--c2);
        border: 1px solid var(--bd);
        border-left: 3px solid var(--c);
        font-size: 13px;
      }
      .nt.cr {
        border-left-color: var(--rd);
        box-shadow: 0 0 12px color-mix(in srgb, var(--rd) 20%, transparent);
      }
      .chat-launch {
        position: fixed;
        right: 22px;
        bottom: 22px;
        z-index: 40;
        border: 1px solid var(--bd);
        background: var(--card);
        color: var(--tx);
        padding: 10px 16px;
        border-radius: 10px;
        font-weight: 600;
        font-size: 13px;
        cursor: pointer;
        box-shadow: var(--shadow-md);
        transition: all 0.15s ease;
      }
      .chat-launch:hover {
        background: var(--c2);
        border-color: var(--cy);
        color: var(--cy);
      }
      #chat {
        position: fixed;
        right: 22px;
        bottom: 74px;
        z-index: 40;
        width: 380px;
        max-width: calc(100vw - 28px);
        height: min(520px, calc(100dvh - 110px));
        display: none;
        grid-template-rows: auto 1fr auto;
        background: var(--card);
        border: 1px solid var(--bd);
        border-radius: 12px;
        box-shadow: var(--shadow-lg);
        overflow: hidden;
      }
      #chat.on {
        display: grid;
      }
      #chatHead,
      #chatForm {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        padding: 10px 14px;
      }
      #chatHead {
        background: var(--c2);
        border-bottom: 1px solid var(--bd);
      }
      #chatForm {
        border-top: 1px solid var(--bd);
        background: var(--card);
      }
      #chatForm input {
        flex: 1;
        min-width: 0;
      }
      #chatForm button {
        flex: none;
        white-space: nowrap;
      }
      #chatLog {
        padding: 14px;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 10px;
      }
      .chat-msg {
        max-width: 90%;
        padding: 9px 12px;
        border: 1px solid var(--bd);
        border-radius: 10px;
        background: var(--c2);
        font-size: 13px;
        color: var(--tx);
        white-space: pre-wrap;
      }
      .chat-msg.user {
        align-self: flex-end;
        border-color: var(--cy-border);
        background: var(--cy-light);
        color: var(--cy-hover);
      }
      [data-theme="dark"] .chat-msg.user {
        color: var(--tx);
      }
      .chat-result {
        width: 100%;
        padding: 12px;
        border: 1px solid var(--bd);
        border-radius: 10px;
        background: var(--c2);
        font-size: 13px;
      }
      .chat-result div {
        margin: 4px 0;
      }
      .chat-result small {
        color: var(--mu);
      }
      #chatInput {
        flex: 1;
        min-width: 0;
        background: var(--c2);
        border: 1px solid var(--bd);
        border-radius: 8px;
        color: var(--tx);
        padding: 8px 12px;
        font: inherit;
        font-size: 13px;
        outline: 0;
      }
      #chatInput:focus {
        border-color: var(--cy);
      }
      .ev {
        display: grid;
        grid-template-columns: 66px minmax(0, 1fr);
        gap: 10px;
        padding: 10px 2px;
        border-top: 1px solid var(--bd);
        align-items: center;
      }
      .ev.nw {
        animation: in 0.5s;
        background: var(--cy-light);
      }
      .ev > span:first-child,
      .big,
      .kv small,
      td:first-child,
      .tag,
      .rec {
        font-variant-numeric: tabular-nums;
      }
      .hb {
        display: grid;
        grid-template-columns: 120px 1fr 44px;
        gap: 8px;
        align-items: center;
        margin: 7px 0;
        font-size: 12px;
      }
      .tk {
        background: var(--c2);
        border-radius: 6px;
        overflow: hidden;
        display: flex;
        border: 1px solid var(--bd);
      }
      .tk i {
        display: block;
        height: 8px;
        background: var(--c);
      }
      .pr {
        animation: rp 1.6s infinite;
        transform-box: fill-box;
        transform-origin: center;
      }
      @keyframes rp {
        to {
          transform: scale(2.8);
          opacity: 0;
        }
      }
      .vb rect:hover {
        opacity: 0.7;
      }
      .vid {
        position: relative;
        aspect-ratio: 16/8;
        border-radius: 10px;
        overflow: hidden;
        background: var(--video-bg);
        border: 1px solid var(--bd);
      }
      .gd {
        position: absolute;
        inset: 0;
        background:
          linear-gradient(rgba(255, 255, 255, 0.05) 1px, transparent 1px) 0 0/100% 28px,
          linear-gradient(90deg, rgba(255, 255, 255, 0.05) 1px, transparent 1px) 0 0/40px 100%;
      }
      .bx {
        position: absolute;
        width: 9%;
        height: 38%;
        border: 1.5px solid var(--cy);
        border-radius: 4px;
        background: color-mix(in srgb, var(--cy) 10%, transparent);
        animation: dr var(--d) ease-in-out infinite alternate;
      }
      .bx em {
        position: absolute;
        top: -16px;
        left: -1px;
        font: 600 10px monospace;
        background: var(--cy);
        color: #fff;

      .detection-box > span { position: absolute; inset-inline-start: -1px; top: -17px; padding: 2px 4px; white-space: nowrap; border-radius: 3px 3px 0 0; font: 9px "IBM Plex Mono",monospace; background: #59b4ffe6; color: #050510; }
      .weapon-box { border: 2px solid #fb416c; background: #fb416c18; }
      .weapon-box > span { background: #fb416c; color: #fff; font-weight: 600; }
      .threat-active { border-color: #fb416c; box-shadow: 0 0 0 2px #fb416c25; }
      .threat-active .camera-detections { color: var(--rd); }
      .empty-state { padding: 30px; text-align: center; color: var(--mu); line-height: 1.8; }
      .empty-state a { color: var(--cy); }
      .catalog-thumbnail { width: 100%; aspect-ratio: 16/9; object-fit: cover; border-radius: 7px; margin-bottom: 14px; }
      .evidence-image { width: 100%; max-height: 52vh; object-fit: contain; background: #05050d; border-radius: 8px; }
      .weapon-alert { display: grid; gap: 15px; }
      .alert-kicker { color: var(--rd); font-weight: 600; font-size: 11px; letter-spacing: .12em; }
      .weapon-alert h1 { color: var(--rd); text-transform: uppercase; }
      .critical-modal { max-width: 760px; }
      .settings-input { padding: 9px 12px; border: 1px solid var(--bd); border-radius: 7px; background: var(--c2); color: var(--tx); min-width: 240px; }
      @media(min-width:1800px) { .camera-grid { grid-template-columns: repeat(3,minmax(0,1fr)); } }
      @media(max-width:1000px) { .camera-grid { grid-template-columns: 1fr; } .camera-stage { max-height: none; } }
      .severity-badge { display: inline-flex; align-items: center; gap: 6px; padding: 5px 9px; border-radius: 6px; border: 1px solid color-mix(in srgb,var(--severity-color) 65%,transparent); background: color-mix(in srgb,var(--severity-color) 18%,var(--card)); color: var(--severity-color); font-size: 11px; line-height: 1.25; font-weight: 700; letter-spacing: .035em; white-space: nowrap; }
      .severity-badge[data-severity="CRITICAL"] { color: #fff; background: #d72c51; border-color: #fb416c; box-shadow: 0 0 12px #fb416c22; }
      .severity-badge[data-severity="HIGH"] { color: #fff; background: #ba511b; border-color: #ed965b; }
      .incident-row td { background: color-mix(in srgb,var(--severity-color) 6%,var(--card)); }
      .incident-row:nth-child(even) td { background: color-mix(in srgb,var(--severity-color) 10%,var(--card)); }
      .incident-row td:first-child { border-inline-start: 4px solid var(--severity-color); }
      .incident-row .severity-badge { margin-block: 5px; }
      .incident-row strong { font-size: 13px; }
      #np .nt { display: grid; gap: 7px; border-inline-start-width: 4px; }
      #np .severity-badge { justify-self: start; }
      #bc.has-unread { display: inline-grid; place-items: center; min-width: 20px; height: 20px; padding-inline: 5px; border-radius: 6px; background: #d72c51; color: #fff; }
      #ts .severity-toast { border-inline-start: 4px solid var(--severity-color); background: color-mix(in srgb,var(--severity-color) 8%,var(--card)); }
      #ts .severity-toast[data-severity="CRITICAL"], #ts .severity-toast[data-severity="HIGH"] { font-weight: 600; color: var(--severity-color); }
      body.lockdown::after { border-color: var(--severity-color,var(--rd)); box-shadow: inset 0 0 24px 6px color-mix(in srgb,var(--severity-color,var(--rd)) 40%,transparent); }
      .critical-modal { border-color: var(--severity-color,var(--rd)) !important; box-shadow: 0 0 40px color-mix(in srgb,var(--severity-color,var(--rd)) 35%,transparent) !important; }
      .weapon-alert h1, .weapon-alert .alert-kicker { color: var(--severity-color,var(--rd)); }
      .alert-kicker { display: flex; align-items: center; gap: 12px; }
      .alert-kicker .severity-badge { padding: 7px 12px; font-size: 12px; }
      .people-table td { vertical-align: middle; }
      .person-thumbnail { display: block; padding: 0; width: 62px; height: 78px; border: 1px solid var(--bd); border-radius: 7px; background: var(--c2); overflow: hidden; cursor: pointer; }
      .person-thumbnail img { width: 100%; height: 100%; object-fit: cover; }
      .person-thumbnail:hover { border-color: var(--cy); }
      .person-id-button { border: 0; background: none; color: var(--cy); font-weight: 600; cursor: pointer; padding: 5px 0; }
      .person-id-button:hover { text-decoration: underline; }
      .person-profile { display: grid; grid-template-columns: minmax(140px,260px) minmax(0,1fr); gap: 20px; align-items: start; }
      .person-profile > img { width: 100%; max-height: 55vh; object-fit: contain; background: var(--video-bg); border: 1px solid var(--bd); border-radius: 9px; }
      @media(max-width:560px) { .person-profile { grid-template-columns: 1fr; } .person-profile > img { max-height: 35vh; } }
    </style>
  </head>
  <body>
    <div class="app">
      <nav>
        <div class="logo"><svg class="logo-eye" viewBox="0 0 40 40" aria-hidden="true"><path d="M3.5 20s5.7-10 16.5-10 16.5 10 16.5 10-5.7 10-16.5 10S3.5 20 3.5 20Z" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="20" cy="20" r="6.2" fill="none" stroke="currentColor" stroke-width="2.5"/><circle cx="20" cy="20" r="2.3" fill="var(--gr)"/></svg><span>Raqeeb</span></div>
        <div id="nl"></div>
        <div class="sys">
          <div>
            <span class="dot"></span><b style="color: var(--gr)" id="sysOnlineText">CONNECTING</b>
          </div>
          <div id="sysCamsText">Camera sources: connecting?</div>
          <div><span id="sysAiLabel">AI detector:</span> <b id="aist">OFFLINE</b></div>
          <div><span id="sysSyncLabel">Last sync:</span> <span class="sy">--</span></div>
          <div><span id="sysDateLabel">?</span> · <span class="sy">--</span></div>
        </div>
      </nav>
      <div class="mn">
        <header class="top">
          <div class="header-controls">
          <span class="chip mode-chip" id="modeLabel">RECORDED CAMERAS</span>
          <span class="chip" id="aic" onclick="go('health')">AI: offline</span>
          <span class="chip" onclick="bell()">🔔 <b id="bc">0</b></span>
          <button class="chip icon-chip" id="themeToggle" type="button" onclick="toggleTheme()" aria-label="Toggle theme" title="Toggle theme">🌙 Dark</button>
          <button class="chip lang-chip" id="langToggle" type="button" onclick="toggleLang()" aria-label="Toggle language" title="Toggle language">🌐 العربية</button>
          </div>
          <div class="search-tools">
            <div class="search-field">
              <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="10.8" cy="10.8" r="7.3"/><path d="m16.3 16.3 4.4 4.4" stroke-linecap="round"/></svg>
          <input
            id="q"
            aria-label="Search people, cameras, and incidents"
            placeholder="Search Person ID, camera, incident, location, type…"
            oninput="sq(this.value)"
          />
              <kbd class="search-shortcut" aria-hidden="true">/</kbd>
            </div>
    <button
      class="chat-launch"
      id="chatLaunchBtn"
      type="button"
      onclick="toggleChat()"
      aria-controls="chat"
      aria-expanded="false"
    >
      ◌ Person Search
    </button>
    <section id="chat" aria-label="Person search assistant">
      <div id="chatHead">
        <div>
          <b id="chatTitle">Person Search Assistant</b>
          <div class="mu" id="chatSub" style="font-size: 11px">Search AI tracks from your camera footage</div>
        </div>
        <button
          class="x"
          type="button"
          onclick="toggleChat()"
          aria-label="Close assistant"
        >
          ×
        </button>
      </div>
      <div id="chatLog" aria-live="polite">
        <div class="chat-msg" id="chatWelcome">
          Describe someone to search live AI tracks and demo records. Try: “Find a person wearing a blue shirt.”
        </div>
        <button
          class="chip"
          id="chatSampleChip"
          type="button"
          onclick="chatSearch(currentLang === 'ar' ? 'البحث عن شخص يرتدي قميصاً أزرق' : 'Find a person wearing a blue shirt')"
        >
          Find person in a blue shirt
        </button>
      </div>
      <form id="chatForm" onsubmit="submitChat(event)">
        <input
          id="chatInput"
          autocomplete="off"
          placeholder="Describe clothing, location, or ID…"
          aria-label="Describe a person"
        />
        <button class="btn" id="chatSubmitBtn" type="submit" aria-label="Search">Search</button>
      </form>
    </section>
          </div>
        </header>
        <div id="np" class="card"></div>
        <main id="main"></main>
      </div>
    </div>
    <div id="m" class="ov" onclick="if (event.target == this) closeM();">
      <div id="mb" class="md"></div>
    </div>
    <div id="ts"></div>
    <script src="app.js"></script>
  </body>
</html>
